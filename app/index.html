<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>暗盒</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="booting">
<canvas id="gl"></canvas>
<div id="grain"></div>
<div id="vignette"></div>

<div id="bar"></div>
<header id="brand">
  <div class="mark">暗盒</div>
  <div class="line"><span class="en">a shelf of thirty-five millimetre</span><span class="meta" id="meta"></span></div>
</header>
<button id="rec" class="icon" title="录屏 · Ctrl+Shift+R" aria-label="录屏">
  <svg viewBox="0 0 24 24" width="18" height="18"><circle class="ring" cx="12" cy="12" r="7.2"/><circle class="core" cx="12" cy="12" r="3"/></svg>
</button>
<button id="sound" class="icon" title="声音" aria-label="声音">
  <svg viewBox="0 0 24 24" width="18" height="18"><path class="cone" d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z"/><path class="wave" d="M15.2 9.2a4 4 0 0 1 0 5.6M17.6 6.8a7.4 7.4 0 0 1 0 10.4"/><path class="mute" d="M15.4 9.6l5 5M20.4 9.6l-5 5"/></svg>
</button>

<div id="tags"></div>
<footer id="hint"><span>点击胶卷，抽出底片</span><i></i><span>把照片或视频拖到胶卷上，即可装片</span></footer>

<section id="roll" hidden>
  <button id="back" class="ghost"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>胶卷柜</button>
  <div class="roll-head">
    <div class="kicker"><i class="swatch"></i><span id="rollBrand"></span></div>
    <h1 id="rollName" spellcheck="false"></h1>
    <div id="rollStock"></div>
    <div class="sim-line">
      <button id="simPick" class="sim-pick" title="胶片模拟"><span class="k">胶片模拟</span><b id="simName"></b><svg viewBox="0 0 24 24" width="14" height="14"><path d="M7 10l5 5 5-5"/></svg></button>
      <label id="simAmt" class="amt" title="胶片浓度：0 是原片，100 是 SpektraLab 的原样成片"><span class="k">浓度</span><input type="range" min="0" max="100" step="1" value="70"><output>70</output></label>
    </div>
    <div id="simPanel" class="sim-panel" hidden></div>
  </div>
  <div class="dock">
    <button id="load" class="pill"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14"/></svg><span>装入照片 / 视频</span><small id="room"></small></button>
    <div class="counter"><span class="cur" id="cur">01</span><span class="sep">/</span><span class="tot" id="tot">08</span></div>
    <div class="tip">滚轮或拖动胶片抽卷<i></i>点击画面放大</div>
  </div>
  <div id="scrub"><div class="ticks"></div><i class="knob"></i></div>
</section>

<section id="lightbox" hidden>
  <div class="lb-shade"></div>
  <figure class="lb-fig"><canvas class="lb-gl"></canvas>
    <video class="lb-video" playsinline loop preload="auto"></video>
    <div class="lb-media">
      <button class="lb-play" aria-label="暂停"><svg viewBox="0 0 24 24" width="16" height="16"><path class="i-pause" d="M9 6v12M15 6v12"/><path class="i-play" d="M8 5.5v13l10.5-6.5z"/></svg></button>
      <span class="lb-time">00:00 / 00:00</span>
      <div class="lb-track"><i class="lb-fill"></i></div>
      <button class="lb-mute" aria-label="静音"><svg viewBox="0 0 24 24" width="17" height="17"><path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z"/><path class="i-wave" d="M15.2 9.2a4 4 0 0 1 0 5.6M17.6 6.8a7.4 7.4 0 0 1 0 10.4"/><path class="i-x" d="M15.4 9.6l5 5M20.4 9.6l-5 5"/></svg></button>
    </div>
  </figure>
  <header class="lb-head"><div class="lb-roll"></div></header>
  <button class="lb-close" aria-label="关闭"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button class="lb-nav lb-prev" aria-label="上一张"><svg viewBox="0 0 24 48" width="20" height="40"><path d="M18 4L5 24l13 20"/></svg></button>
  <button class="lb-nav lb-next" aria-label="下一张"><svg viewBox="0 0 24 48" width="20" height="40"><path d="M6 4l13 20L6 44"/></svg></button>
  <footer class="lb-foot">
    <div class="lb-no"><i>No.</i><span>01</span><em>/ 01</em></div>
    <div class="lb-state"></div>
    <div class="lb-acts"><label class="amt lb-amt" title="胶片浓度"><span class="k">浓度</span><input type="range" min="0" max="100" step="1" value="70"><output>70</output></label><button class="lb-del"><svg viewBox="0 0 24 24" width="15" height="15"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>删除这张</button></div>
  </footer>
</section>

<div id="drop"><div class="drop-card"></div></div>
<div id="toast"><span class="msg"></span><button class="act"></button></div>
<div id="veil"></div>
<input type="file" id="file" accept="image/*,video/*,.heic,.heif,.mov,.mkv" multiple hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
